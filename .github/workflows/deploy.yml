name: Deploy Tab Radio

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: tab-radio-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Escribir .env desde los secrets
        env:
          DISCORD_TOKEN: ${{ secrets.TAB_RADIO_DISCORD_TOKEN }}
          PUBLIC_URL: ${{ vars.TAB_RADIO_PUBLIC_URL }}
        run: |
          umask 077
          {
            echo "DISCORD_TOKEN=${DISCORD_TOKEN}"
            echo "PUBLIC_URL=${PUBLIC_URL}"
          } > .env

      - name: Levantar contenedor
        run: docker compose -p tab-radio up -d --build --remove-orphans

      - name: Esperar a que este sano
        run: |
          for i in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tab-radio 2>/dev/null || echo "none")
            echo "estado: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          docker logs --tail 50 tab-radio
          exit 1

      - name: Limpiar imagenes viejas
        if: always()
        run: docker image prune -f
